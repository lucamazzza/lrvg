image: gcc:latest

variables:
  DEBIAN_FRONTEND: noninteractive

stages:
  - test
  - build
  - package

before_script:
  - apt-get update -qq
  - apt-get install -y make cmake unzip curl
  - apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
  - apt-get install -y libfreeimage-dev libglfw3-dev libjpeg-dev libpng-dev libtiff-dev libwebp-dev libopenexr-dev libraw-dev libopenjp2-7-dev zlib1g-dev libjxr-dev
  - ./scripts/build_dependencies.sh

test:
  stage: test
  cache:
    key: glfw-build
    paths:
      - .deps_build/glfw/
  script:
    - CI=true make test
  artifacts:
    name: "test-results"
    paths:
      - engine/obj/Debug/engine_test
    expire_in: 1 week
    when: always

build_release:
  stage: build
  cache:
    key: glfw-build
    paths:
      - .deps_build/glfw/
  script:
    - CI=true make release
  artifacts:
    name: "release-build"
    paths:
      - bin/Release/
    expire_in: 1 week

build_debug:
  stage: build
  cache:
    key: glfw-build
    paths:
      - .deps_build/glfw/
  script:
    - CI=true make debug
  artifacts:
    name: "debug-build"
    paths:
      - bin/Debug/
    expire_in: 3 days

package:
  stage: package
  cache:
    key: glfw-build
    paths:
      - .deps_build/glfw/
  script:
    - apt-get install -y patchelf
    - CI=true make package
  artifacts:
    name: "hanoi-package-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/hanoi.tar.gz
    expire_in: 30 days
  only:
    - main
    - master
    - tags
